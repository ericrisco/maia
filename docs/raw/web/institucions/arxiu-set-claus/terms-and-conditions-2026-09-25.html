### 1. Finalitat d’aquesta pàgina web
Heu accedit a la pàgina web mitjançant la qual l’Arxiu Nacional d’Andorra posa a disposició del públic arxius sonors, audiovisuals, fotografies, textuals i altres arxius relatius al seu fons documental.  
Aquesta pàgina web es troba ubicada dins del domini d’Internet www.cultura.ad titularitat del Govern d’Andorra. No obstant això, els termes i les condicions d’ús d’aquesta pàgina web són els específics que s’estableixen en aquest avís legal.  
L’Arxiu Nacional d’Andorra està situat al carrer Prada Casadet, 8-12, edifici Prada Casadet, AD500, d’Andorra la Vella (Principat d’Andorra), amb adreça electrònica &lt;a href=&quot;mailto:arxiu_nacional_andorra@govern.ad&quot;&gt;arxiu\_nacional\_andorra@govern.ad&lt;/a&gt; i número de telèfon de contacte +376 802288.

### 2. Acceptació dels termes i condicions d’ús d’aquesta pàgina web
L’accés a aquesta pàgina web comporta la plena acceptació per part dels usuaris dels termes i les condicions d’ús establerts en aquest avís legal (en endavant, conjuntament, “els termes i condicions d&#39;ús”).  
Així mateix, els usuaris s’obliguen a fer un ús diligent d’aquesta pàgina web, amb subjecció a la legislació vigent, la bona fe i els bons costums, i sense contravenir la moral i l’ordre públic.

### 3. Reserva de la facultat de modificació d’aquesta pàgina web, i dels termes i condicions per fer-ne ús
El Govern d’Andorra i l’Arxiu Nacional d’Andorra es reserven la facultat d’efectuar, sense avís previ, en qualsevol moment, les modificacions i les actualitzacions de la configuració i la presentació d’aquesta pàgina web, així com dels continguts que s’hi inclouen.  

Així mateix, el Govern d’Andorra i l’Arxiu Nacional d’Andorra es reserven la facultat d’efectuar, sense avís previ, en qualsevol moment i amb efectes immediats, les modificacions i les actualitzacions periòdiques que considerin oportunes dels termes i condicions.  

Per tant, el Govern d’Andorra i l’Arxiu Nacional d’Andorra recomanen als usuaris d’aquesta pàgina web que periòdicament en revisin els termes i condicions.

### 4. Drets i posicions jurídiques sobre els continguts que integren aquesta pàgina web

**Definició del terme “continguts”:**  
El terme “continguts” fa referència a tots els continguts que conformen aquesta pàgina web. S’entenen com a tals, a títol merament enunciatiu i no limitatiu, el codi font, el disseny i l’estructura de navegació de la pàgina web, així com els signes distintius, les obres i els enregistraments audiovisuals, les fotografies i els textos que s’hi mostren.

**Drets i posicions jurídiques sobre els continguts:**  
Els continguts d’aquesta pàgina web són objecte de drets d’autor i drets veïns dels drets d’autor, drets de propietat industrial com ara marques i dissenys, drets d’imatge i/o altres drets i/o posicions jurídiques de contingut econòmic anàleg de titularitat del Govern d’Andorra, de l’Arxiu Nacional d’Andorra o de tercers que els han atorgat les pertinents llicències o autoritzacions. 

Per tant, l’accés a aquesta pàgina web no atorga als usuaris cap titularitat ni dret d’ús sobre els continguts esmentats (la reproducció, distribució, comunicació pública, posada a disposició del públic o transformació, entre d’altres), excepte que el Govern d’Andorra, l’Arxiu Nacional d’Andorra o els tercers titulars dels drets i/o posicions jurídiques de què es tracti els ho autoritzin, bé indicant-ho o permetent-ho expressament pel que fa a determinats continguts.

**Drets de reproducció sobre els continguts:**  
Es permet la lliure descàrrega i reproducció de les imatges publicades en aquest web sempre que:  
- Siguin per a ús privat o l&#39;ús que se’n faci sigui amb finalitats d&#39;investigació, docents i no comercials. En el darrer cas, caldrà la menció de la font **ANA/Identificador del document.**
- No se&#39;n faci difusió per cap mitjà.
- No es faci cap modificació de les imatges i se’n respecti l’autoria.

Per a altres usos consulteu a l’Arxiu Nacional d’Andorra: &lt;a href=&quot;mailto:arxiu_nacional_andorra@govern.ad&quot;&gt;arxiu\_nacional\_andorra@govern.ad&lt;/a&gt;  
[Enllaç a la sol·licitud de reproducció](https://www.cultura.ad/arxiu-nacional-d-andorra/serveis-i-acces/reproduccio-de-documents-audiovisuals-i-fotografics)

Segons el que s’ha establert més amunt, el Govern d’Andorra i l’Arxiu Nacional d’Andorra es reserven la facultat de fer ús de marques d’aigua, dispositius tecnològics o altres mitjans de seguretat que permetin el rastreig o el seguiment en línia dels usos no autoritzats dels dits continguts. I, en tot cas, el Govern d’Andorra, l’Arxiu Nacional d’Andorra i els eventuals tercers afectats es reserven la facultat d’interposar les accions legals que corresponguin contra els usuaris que infringeixin els drets de propietat intel·lectual indicats, drets de propietat industrial, drets d’imatge i/o drets o posicions jurídiques de contingut econòmic anàleg.

### 5. Responsabilitats

**Conductes dels usuaris d’aquesta pàgina web:**  
El Govern d’Andorra i l’Arxiu Nacional d’Andorra no són responsables dels danys i perjudicis ni d’altres conseqüències que es derivin de l’incompliment per part dels usuaris dels termes i condicions.  
El Govern d’Andorra i l’Arxiu Nacional d’Andorra no són responsables dels danys i perjudicis ni d’altres conseqüències que es derivin de la indisponibilitat d’aquesta pàgina web o dels seus continguts per motius tècnics, de seguretat, control, actualitzacions o manteniment, o per errades degudes al servidor o a tercers intermediaris o proveïdors.  

El Govern d’Andorra i l’Arxiu Nacional d’Andorra no són responsables dels danys i perjudicis causats als usuaris d’aquesta pàgina web per programes informàtics, virus o altres elements que escapin del seu control.  

El Govern d’Andorra i l’Arxiu Nacional d’Andorra no exerceixen cap control sobre els eventuals serveis, els continguts i/o altres elements als quals els usuaris d’aquesta pàgina web puguin accedir a través dels dispositius tècnics d’enllaços, directoris o altres mitjans inclosos en aquesta pàgina web, que hagin estat incorporats pel Govern d’Andorra, l’Arxiu Nacional d’Andorra o per usuaris d’aquesta pàgina web.  

Per tant, el Govern d’Andorra i l’Arxiu Nacional d’Andorra no són responsables de la disponibilitat tècnica, la qualitat, la veracitat o l’exactitud, entre d’altres, dels serveis eventuals, continguts i/o altres elements als quals s’hagi accedit, ni dels danys i perjudicis ni d’altres conseqüències que es produeixin com a conseqüència del seu ús.

### 6. Autorització d’enllaços
Qualsevol enllaç de tercers ha de ser a la pàgina principal, i estan prohibits els enllaços profunds, el framing (entramat) i qualsevol altre aprofitament dels continguts d’aquesta pàgina web per part de tercers, excepte que el Govern d’Andorra o l’Arxiu Nacional d’Andorra ho autoritzin, bé indicant-ho o permetent-ho expressament, pel que fa a determinats continguts –per exemple, mitjançant les opcions que els continguts s’enviïn per correu electrònic o es comparteixin en xarxes socials–, o bé perquè hagin atorgat les llicències o autoritzacions escrites a aquest efecte.  

Així mateix, el Govern d’Andorra i l’Arxiu Nacional d’Andorra prohibeixen la creació d’enllaços des de llocs web amb continguts que siguin contraris a la llei, la bona fe, els bons costums, la moral o l’ordre públic.


### 7. Dret de denegació de l’accés
El Govern d’Andorra i l’Arxiu Nacional d’Andorra es reserven el dret de denegar o retirar l’accés a aquesta pàgina web i/o als continguts que s’hi ofereixen, en qualsevol moment i sense necessitat d’avís previ, als usuaris que incompleixin els termes i condicions d’ús o que en facin un mal ús, contravenint-hi la bona fe, els bons costums, la moral o l’ordre públic.

### 8. Galetes
Aquesta pàgina web utilitza galetes pròpies i de tercers per analitzar la navegació dels usuaris i oferir una millor experiència de navegació. Els usuaris poden configurar el seu navegador per bloquejar-ne la instal·lació o per rebre un avís abans d’acceptar-les. No obstant això, el bloqueig de l’ús de galetes pot afectar l’òptima navegació i l’accés a determinats continguts.

### 9. Legislació i jurisdicció aplicable
Els termes i condicions que regeixen aquesta pàgina web, així com totes les relacions que se’n derivin, estan protegides per la legislació andorrana. 

Per a qualsevol qüestió litigiosa derivada de l&#39;existència, l&#39;accés, la utilització o el contingut dels termes i condicions, els usuaris d’aquesta pàgina web i l’Arxiu Nacional d’Andorra, amb renúncia expressa a qualsevol altre fur que els pugui correspondre, es sotmeten a la jurisdicció i la competència exclusiva dels batlles i tribunals d’Andorra.
