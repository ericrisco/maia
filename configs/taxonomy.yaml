# MAIA generation taxonomy — PLAN M2.01
#
# ⚠ DRAFT, NOT APPROVED. `approved: false` makes the generation engine refuse to run.
#
# This is a starting point, not a proposal to rubber-stamp: it was derived from the branches
# and examples the Phase-1 plan enumerates, so it covers what the plan names and guesses at the
# rest. The node list decides what the model knows — arguing about this file is far cheaper
# than regenerating 12,000 examples at €30-60 of API.
#
# PO review checklist:
#   1. Delete nodes that do not matter and add the ones that are missing. Andorran judgement
#      beats a literal reading of the plan; keep the total inside 60-80.
#   2. Check the `keywords` of each node — they are what retrieves that node's grounding
#      passages from the corpus. Run `maia-taxonomy configs/taxonomy.yaml --corpus <corpus>`
#      to see which nodes retrieve too little to be groundable.
#   3. Raise `weight` on what MAIA must be strongest at, lower it on the peripheral.
#   4. Set `approved: true` and fill `approved_by`.
#
# The `legal` branch teaches CONCEPTS only (normative hierarchy, judicial organisation, what
# each code regulates). Citable details — article numbers, amounts, deadlines, tax rates —
# stay out of the weights deliberately and are looked up in RAG (decision D8).

version: "0.1-draft"
approved: false
approved_by: ""
notes: >-
  Draft derived from the Phase-1 plan's enumeration. Awaiting PO review (M2.01), which gates
  all generation from M2.03 onward.

