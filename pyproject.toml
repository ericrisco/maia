[project]
name = "maia"
version = "0.0.0"
description = "MAIA — Model Andorrà d'Intel·ligència Artificial: an open Gemma 4 12B QLoRA fine-tune + RAG for Andorran Catalan."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Eric Risco de la Torre" }]
keywords = ["andorra", "catalan", "llm", "gemma", "qlora", "rag"]
dependencies = [
    "anthropic>=0.120.0",
    "huggingface-hub>=1.24.0",
    "mwparserfromhell>=0.6",
    "pyarrow>=25.0.0",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "requests>=2.31",
    "trafilatura>=1.8",
    "types-pyyaml>=6.0.12.20260724",
]

[project.urls]
Homepage = "https://github.com/ericrisco/maia"
Repository = "https://github.com/ericrisco/maia"

[project.scripts]
maia-validate-corpus = "maia.corpus.validate:main"
maia-consolidate-corpus = "maia.corpus.consolidate:main"
maia-publish-corpus = "maia.corpus.publish:main"
maia-corpus-report = "maia.corpus.coverage:main"
maia-sample-corpus = "maia.corpus.sampling:main"
maia-validate-dataset = "maia.synth.validate:main"
maia-taxonomy = "maia.synth.taxonomy:main"
maia-glossary = "maia.synth.glossary:main"
maia-generate = "maia.synth.generate:main"
maia-mix-general-ca = "maia.synth.general_ca:main"
maia-filter-dataset = "maia.synth.filter:main"
maia-pilot = "maia.synth.pilot:main"
maia-generate-full = "maia.synth.run:main"
maia-split = "maia.synth.splits:main"
maia-distribution = "maia.synth.distribution:main"
maia-publish-dataset = "maia.synth.publish:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maia"]

# ─────────────────────────────────────────────────────────────
# Ruff — lint + format
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─────────────────────────────────────────────────────────────
# mypy — strict
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src", "tests"]

# pyarrow, transformers and unsloth ship no py.typed marker, and the last two are only ever
# imported inside a function behind a blocked-by-resource seam. Scoped so the rest stays strict.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "transformers.*", "unsloth.*", "trl.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# pytest — layered testing (unit fast; integration behind marker)
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external services (default fast gate)",
    "integration: tests against real dependencies (ephemeral containers/services)",
]

# ─────────────────────────────────────────────────────────────
# Coverage — gate over the FULL suite (unit + integration)
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["src/maia"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
