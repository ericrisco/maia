[project]
name = "maia"
version = "0.0.0"
description = "MAIA — Model Andorrà d'Intel·ligència Artificial: an open Gemma 4 12B QLoRA fine-tune + RAG for Andorran Catalan."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Eric Risco de la Torre" }]
keywords = ["andorra", "catalan", "llm", "gemma", "qlora", "rag"]
dependencies = [
    "mwparserfromhell>=0.6",
    "pydantic>=2.9",
    "requests>=2.31",
    "trafilatura>=1.8",
]

[project.urls]
Homepage = "https://github.com/ericrisco/maia"
Repository = "https://github.com/ericrisco/maia"

[project.scripts]
maia-validate-corpus = "maia.corpus.validate:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maia"]

# ─────────────────────────────────────────────────────────────
# Ruff — lint + format
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─────────────────────────────────────────────────────────────
# mypy — strict
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src", "tests"]

# ─────────────────────────────────────────────────────────────
# pytest — layered testing (unit fast; integration behind marker)
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external services (default fast gate)",
    "integration: tests against real dependencies (ephemeral containers/services)",
]

# ─────────────────────────────────────────────────────────────
# Coverage — gate over the FULL suite (unit + integration)
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["src/maia"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
