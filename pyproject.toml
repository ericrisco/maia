[project]
name = "cervell"
version = "0.1.0"
description = "El cervell andorrà — corpus de coneixement andorrà, validat i navegable."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
cervell = "cervell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cervell", "src/curacio"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Scripts de procedència del subcorpus de parla: es publiquen tal com es van
# executar, perquè formen part de la cadena de transformació registrada.
extend-exclude = ["docs/raw/corpus-parla-andorrana"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# La curació conté cadenes literals catalanes i plantilles d'informe llargues.
"src/curacio/*.py" = ["E501", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
