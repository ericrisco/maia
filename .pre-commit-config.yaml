# Pre-commit: ruff (lint + format) then mypy (strict).
# Install once:  uv run pre-commit install
# Run on all:    uv run pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy runs in the project env (via uv) so it sees the real dependencies —
  # the isolated mirrors-mypy env would miss pytest/pydantic/etc. and drift from CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project env)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
