# Pre-commit: ruff (lint + format) then mypy (strict).
# Install once:  uv run pre-commit install
# Run on all:    uv run pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # ruff + mypy run from the project env (via uv) so pre-commit, CI and local dev
  # use the exact same tool versions — a pinned hook repo would drift from pyproject.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, project env)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (project env)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict, project env)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
